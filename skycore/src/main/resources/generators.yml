# =====================================================================
#  Generators per dimension. A lava/water (or basalt) generator on an island
#  produces blocks using the island's generator level for that dimension.
#  Weights in each level sum to 100 ("Redstone/Lapis" is split 50/50).
#  island-level: the island level required to buy this generator level.
#  The End Portal Frame chance is separate (rolled when a player breaks a
#  Nether generator block) and has a pity timer.
# =====================================================================

