# =====================================================================
#  Spawners. One block stores N units (stack). Every cycle the block spawns
#  ONE entity representing (N x mobs-per-unit-per-cycle) mobs (fractions accumulate).
#  - Killed by a player: loot of every represented mob + ONE Combat action.
#  - Not killed before the next cycle: harvested virtually (no XP, no Roses).
#  Unlocking a type costs Roses once per account (soulbound unlock);
#  units cost Dollars and are tradable.
#  Loot entries: item, amount per mob, chance (0-1). Values follow prices.yml.
# =====================================================================

cycle-seconds: 20
mobs-per-unit-per-cycle: 0.3333333
storage-stacks: 54

types:
  cow:
    {name: "Cow", entity: COW, dimension: overworld, combat: 1, roses: 5, dollars: 9000,
     loot: [{item: BEEF, amount: 1, chance: 1.0}, {item: LEATHER, amount: 1, chance: 0.5}]}
  zombie:
