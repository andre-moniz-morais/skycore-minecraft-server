# =====================================================================
#  Base sell prices (Dollars). Single source of truth for selling.
#  - Sell chests / wands:  price x island multiplier x skill bonus x pet x prestige (capped).
#  - /sell hand|all:       base price only.
#  - Admin shop buys at:   price x economy.admin-shop-buy-factor (config.yml).
#  Items not listed here cannot be sold and stay inside sell chests.
#  "skill" decides which skill sell bonus / skill pet applies.
# =====================================================================

