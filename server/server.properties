# SkyCore - server.properties template (copied to the data folder on first start only).
# Islands live in the SkyCore void worlds (skyblock, skyblock_nether, skyblock_end).
# The default world below is an empty flat world nobody plays in.
motd=§d§lSkyCore §7- Skyblock
server-port=25565
max-players=20
online-mode=true
white-list=false
enforce-whitelist=false
difficulty=normal
gamemode=survival
pvp=false
spawn-protection=0
allow-nether=false
allow-flight=false
level-name=world
level-type=minecraft\:flat
generator-settings={"layers"\:[{"block"\:"minecraft\:air","height"\:1}],"biome"\:"minecraft\:the_void"}
generate-structures=false
view-distance=6
simulation-distance=4
entity-broadcast-range-percentage=75
network-compression-threshold=256
sync-chunk-writes=false
max-tick-time=60000
enable-rcon=false
enable-status=true
enforce-secure-profile=true
player-idle-timeout=0
pause-when-empty-seconds=-1
log-ips=true
